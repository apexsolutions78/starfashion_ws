services:
  db:
    image: mysql:8.0
    container_name: starfashion_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: starfashion_db
      MYSQL_USER: starfashion
      MYSQL_PASSWORD: starfashionpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
